name: ÚOHS Analyzer — týdenní analýza

on:
  # Týdenní plán je od 8. 9. 2026 vypnutý.
  #
  # Důvod: příspěvky se připravují příkazem /uohs v Claude Code, kde analýzu
  # dělá Opus 5 nad plným textem PDF. Tenhle workflow běží na Groq/Llama
  # a zapisoval do processed_decisions.json každé analyzované rozhodnutí,
  # ne jen to, o kterém psal. Tím bral /uohs kandidáty dřív, než je vůbec
  # viděl. Do 8. 9. 2026 takto spotřeboval 28 rozhodnutí a založil 12 Issues
  # s rozbitým nadpisem (nefunguje extrakce předmětu z <h1>).
  #
  # Zpět se zapíná odkomentováním dvou řádků níže. Před tím ale oprav
  # extrakci předmětu v uohs_analyzer.py a zvaž, ať zapisuje do
  # processed_decisions.json jen vybrané rozhodnutí.
  #
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:
    # Ruční spuštění z GitHubu zůstává (záložka Actions → Run workflow)

permissions:
  issues: write    # potřebujeme vytvořit Issue
  contents: write  # potřebujeme commitnout processed_decisions.json

jobs:
  analyze:
    name: Analyzovat nová rozhodnutí ÚOHS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Nastavit Python 3.11
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      - name: Spustit ÚOHS Analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python uohs_analyzer.py

      - name: Uložit stav zpracovaných rozhodnutí
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_decisions.json
          git diff --staged --quiet \
            || git commit -m "chore: aktualizace zpracovaných rozhodnutí [skip ci]"
          git push
